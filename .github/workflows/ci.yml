name: CI - Projeto B

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: senha_segura
          POSTGRES_DB: meu_banco
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar Dependências
        run: npm install

      - name: Executar Testes
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: senha_segura
          DB_NAME: meu_banco
          DB_PORT: 5432
        run: npm test

      - name: Executar Lint
        run: npm run lint